name: cryonet.refine

# Keep this file limited to direct dependencies. Exact transitive builds for
# Linux are recorded in conda-lock.yml.
channels:
  - conda-forge
  - nodefaults

dependencies:
  # Core runtime and compiled scientific dependencies
  - python=3.11.13
  - pip=25.2
  - cctbx-base=2023.2
  - numpy=1.26.4
  - scipy=1.13.1
  - numba=0.61.0

  # Python-level direct dependencies
  - pip:
      # The PyPI wheel keeps PyTorch's CUDA/LLVM stack independent from the
      # older Boost/ICU ABI required by cctbx-base 2023.2.
      - torch==2.6.0
      - biopython==1.84
      - biotite==1.4.0
      - biotraj==1.2.2
      - chembl-structure-pipeline==1.2.2
      - click==8.1.7
      - dm-tree==0.1.8
      - einops==0.8.0
      - einx==0.3.0
      - fairscale==0.4.13
      - gemmi==0.7.4
      - hydra-core==1.3.2
      - ihm==2.7
      - imageio==2.37.0
      - mashumaro==3.14
      - ml-collections==1.1.0
      - modelcif==1.2
      - mrcfile==1.5.4
      - pandas==2.3.1
      - pymupdf==1.26.4
      - pynvml==12.0.0
      - pytorch-lightning==2.5.0
      - pyyaml==6.0.2
      - rdkit==2025.9.2
      - scikit-learn==1.6.1
      - seaborn==0.13.2
      - setproctitle==1.3.6
      - torchmetrics==1.8.1
      - tqdm==4.67.1
      - wandb==0.18.7
